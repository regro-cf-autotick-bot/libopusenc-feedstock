{% set name = "libopusenc" %}
{% set version = "0.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://ftp.osuosl.org/pub/xiph/releases/opus/{{ name }}-{{ version }}.tar.gz
  sha256: f616d3aff9b2034547894ccb8ab56c36cf1a4acb0d922c5d7119f97bbe58642c

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - make
    - pkgconfig
  host:
    - libopus
  run:
    - libopus

test:
  commands:
    - test -f ${PREFIX}/include/opus/opusenc.h
    - test -f ${PREFIX}/lib/libopusenc${SHLIB_EXT}

about:
  home: https://github.com/xiph/libopusenc
  license: BSD-3-Clause
  license_file: COPYING
  summary: 'Library for encoding .opus audio files and live streams'

extra:
  recipe-maintainers:
    - asafkahlon
